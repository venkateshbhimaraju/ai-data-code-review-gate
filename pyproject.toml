[project]
name = "dqgate"
version = "0.1.0"
description = "Local-first SQL quality gate for AI-assisted and human-written data engineering SQL."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "dqgate contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
dqgate = "dqgate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dqgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
